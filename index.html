<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="todo-form" class="todo-form">
      <label for="task-input" class="sr-only">New task</label>
      <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
      <button type="submit" class="add-btn">Add</button>
    </form>

    <p id="counter" class="counter"></p>
    <ul id="task-list" class="task-list"></ul>
    <p id="empty-msg" class="empty">No tasks yet. Add one above!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
